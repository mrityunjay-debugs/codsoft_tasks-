<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Modern Music Player</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap');
        
        body {
            font-family: 'Inter', sans-serif;
            background: linear-gradient(135deg, #1e1e2f, #0f0f17);
            color: #ffffff;
            min-height: 100vh;
        }

        /* Custom Range Slider Styles */
        input[type=range] {
            
            width: 100%;
            background: transparent;
        }
        
        input[type=range]::-webkit-slider-thumb {
            -webkit-appearance: none;
            height: 14px;
            width: 14px;
            border-radius: 50%;
            background: #3b82f6; /* Blue-500 */
            cursor: pointer;
            margin-top: -5px;
            box-shadow: 0 0 10px rgba(59, 130, 246, 0.5);
            transition: transform 0.1s;
        }

        input[type=range]::-webkit-slider-thumb:hover {
            transform: scale(1.2);
        }

        input[type=range]::-webkit-slider-runnable-track {
            width: 100%;
            height: 4px;
            cursor: pointer;
            background: #4b5563; /* Gray-600 */
            border-radius: 2px;
        }

        /* Progress Bar Fill Hack */
        .progress-container {
            position: relative;
            width: 100%;
            height: 4px;
        }
        
        .progress-fill {
            position: absolute;
            top: 0;
            left: 0;
            height: 100%;
            background: #3b82f6;
            border-radius: 2px;
            pointer-events: none;
            width: 0%;
        }

        /* Image rotation animation */
        .spin {
            animation: spin 10s linear infinite;
        }
        @keyframes spin {
            100% { transform: rotate(360deg); }
        }

        /* Custom Scrollbar */
        ::-webkit-scrollbar {
            width: 6px;
        }
        ::-webkit-scrollbar-track {
            background: transparent;
        }
        ::-webkit-scrollbar-thumb {
            background: #4b5563;
            border-radius: 10px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #6b7280;
        }
    </style>
</head>
<body class="flex items-center justify-center p-4 sm:p-8">

    <div class="bg-gray-800/80 backdrop-blur-xl border border-gray-700/50 rounded-3xl shadow-2xl overflow-hidden w-full max-w-4xl flex flex-col md:flex-row">
        
        <!-- Left Side: Player Controls -->
        <div class="p-6 sm:p-8 w-full md:w-1/2 flex flex-col items-center justify-between space-y-6">
            
            <!-- Cover Art -->
            <div class="relative w-48 h-48 sm:w-64 sm:h-64 rounded-full p-2 bg-gradient-to-tr from-blue-500 to-purple-500 shadow-lg shadow-blue-500/20">
                <img id="cover-art" src="https://images.unsplash.com/photo-1614613535308-eb5fbd3d2c17?auto=format&fit=crop&w=500&q=60" alt="Album Art" class="w-full h-full object-cover rounded-full border-4 border-gray-900 object-center transition-transform duration-500">
                <div class="absolute inset-0 flex items-center justify-center">
                    <div class="w-8 h-8 sm:w-12 sm:h-12 bg-gray-900 rounded-full border-2 border-gray-800"></div>
                </div>
            </div>

            <!-- Song Info -->
            <div class="text-center w-full relative">
                <h2 id="song-title" class="text-2xl font-bold text-white truncate px-8">Song Title</h2>
                <p id="artist-name" class="text-gray-400 mt-1 truncate">Artist Name</p>
                <button id="favorite-btn" class="absolute right-2 top-1/2 -translate-y-1/2 text-gray-400 hover:text-red-500 transition-colors text-xl">
                    <i class="fa-regular fa-heart"></i>
                </button>
            </div>

            <!-- Progress Bar -->
            <div class="w-full">
                <div class="flex justify-between text-xs text-gray-400 mb-2 font-medium">
                    <span id="current-time">0:00</span>
                    <span id="duration-time">0:00</span>
                </div>
                <div class="relative flex items-center">
                    <div class="progress-container">
                        <div id="progress-fill" class="progress-fill"></div>
                        <input type="range" id="progress-bar" min="0" max="100" value="0" class="absolute top-0 left-0 w-full h-full opacity-0 z-10 cursor-pointer">
                    </div>
                </div>
            </div>

            <!-- Controls -->
            <div class="flex items-center justify-center space-x-6 w-full">
                <button id="shuffle-btn" class="text-gray-400 hover:text-white transition-colors" title="Shuffle">
                    <i class="fa-solid fa-shuffle"></i>
                </button>
                <button id="prev-btn" class="text-2xl text-gray-300 hover:text-white transition-transform hover:scale-110">
                    <i class="fa-solid fa-backward-step"></i>
                </button>
                
                <button id="play-btn" class="w-14 h-14 flex items-center justify-center bg-blue-500 text-white rounded-full hover:bg-blue-600 transition-transform hover:scale-105 shadow-lg shadow-blue-500/30">
                    <i class="fa-solid fa-play ml-1 text-xl"></i>
                </button>
                
                <button id="next-btn" class="text-2xl text-gray-300 hover:text-white transition-transform hover:scale-110">
                    <i class="fa-solid fa-forward-step"></i>
                </button>
                <button id="repeat-btn" class="text-gray-400 hover:text-white transition-colors" title="Repeat">
                    <i class="fa-solid fa-repeat"></i>
                </button>
            </div>

            <!-- Volume Control -->
            <div class="flex items-center space-x-3 w-full max-w-xs mt-2">
                <button id="mute-btn" class="text-gray-400 hover:text-white transition-colors w-6">
                    <i class="fa-solid fa-volume-high"></i>
                </button>
                <div class="relative flex-1 flex items-center h-4">
                    <div class="progress-container" style="height: 4px;">
                        <div id="volume-fill" class="progress-fill" style="width: 100%;"></div>
                        <input type="range" id="volume-bar" min="0" max="1" step="0.01" value="1" class="absolute top-0 left-0 w-full h-full opacity-0 z-10 cursor-pointer">
                    </div>
                </div>
            </div>
        </div>

        <!-- Right Side: Playlist -->
        <div class="w-full md:w-1/2 bg-gray-900/50 p-6 sm:p-8 flex flex-col h-[500px] md:h-auto border-t md:border-t-0 md:border-l border-gray-700/50">
            <h3 class="text-lg font-semibold mb-4 flex items-center text-gray-200">
                <i class="fa-solid fa-list-ul mr-2 text-blue-400"></i> Playlist
            </h3>
            
            <ul id="playlist" class="flex-1 overflow-y-auto space-y-2 pr-2">
                <!-- Playlist items injected via JS -->
            </ul>
        </div>
    </div>

    <!-- Hidden Audio Element -->
    <audio id="audio" preload="metadata"></audio>

    <script>
        // DOM Elements
        const audio = document.getElementById('audio');
        const playBtn = document.getElementById('play-btn');
        const prevBtn = document.getElementById('prev-btn');
        const nextBtn = document.getElementById('next-btn');
        const shuffleBtn = document.getElementById('shuffle-btn');
        const repeatBtn = document.getElementById('repeat-btn');
        const muteBtn = document.getElementById('mute-btn');
        const favoriteBtn = document.getElementById('favorite-btn');
        
        const coverArt = document.getElementById('cover-art');
        const songTitle = document.getElementById('song-title');
        const artistName = document.getElementById('artist-name');
        
        const progressBar = document.getElementById('progress-bar');
        const progressFill = document.getElementById('progress-fill');
        const currentTimeEl = document.getElementById('current-time');
        const durationTimeEl = document.getElementById('duration-time');
        
        const volumeBar = document.getElementById('volume-bar');
        const volumeFill = document.getElementById('volume-fill');
        
        const playlistEl = document.getElementById('playlist');

        // Mock Data (Royalty Free Music from SoundHelix & Pics from Unsplash)
        const songs = [
            {
                id: 1,
                title: "Cinematic Journey",
                artist: "SoundHelix",
                cover: "https://images.unsplash.com/photo-1614613535308-eb5fbd3d2c17?auto=format&fit=crop&w=500&q=60",
                src: "https://www.soundhelix.com/examples/mp3/SoundHelix-Song-1.mp3"
            },
            {
                id: 2,
                title: "Electro Dreams",
                artist: "SoundHelix",
                cover: "https://images.unsplash.com/photo-1511671782779-c97d3d27a1d4?auto=format&fit=crop&w=500&q=60",
                src: "https://www.soundhelix.com/examples/mp3/SoundHelix-Song-2.mp3"
            },
            {
                id: 3,
                title: "Ambient Sunset",
                artist: "SoundHelix",
                cover: "https://images.unsplash.com/photo-1493225457124-a1a2a5956093?auto=format&fit=crop&w=500&q=60",
                src: "https://www.soundhelix.com/examples/mp3/SoundHelix-Song-3.mp3"
            },
            {
                id: 4,
                title: "Retro Wave",
                artist: "SoundHelix",
                cover: "https://images.unsplash.com/photo-1508700115892-45ecd05ae2ad?auto=format&fit=crop&w=500&q=60",
                src: "https://www.soundhelix.com/examples/mp3/SoundHelix-Song-4.mp3"
            },
            {
                id: 5,
                title: "Acoustic Breeze",
                artist: "SoundHelix",
                cover: "https://images.unsplash.com/photo-1459749411175-04bf5292ceea?auto=format&fit=crop&w=500&q=60",
                src: "https://www.soundhelix.com/examples/mp3/SoundHelix-Song-5.mp3"
            }
        ];

        // State Variables
        let songIndex = 0;
        let isPlaying = false;
        let isShuffle = false;
        let repeatMode = 0; // 0: None, 1: Repeat All, 2: Repeat One
        const favorites = new Set();
        let playedQueue = []; // To keep track of history for back button during shuffle

        // Initialize Player
        function initPlayer() {
            loadSong(songs[songIndex]);
            renderPlaylist();
            updateVolumeUI();
        }

        // Load Song Details
        function loadSong(song) {
            songTitle.innerText = song.title;
            artistName.innerText = song.artist;
            coverArt.src = song.cover;
            audio.src = song.src;
            
            updateFavoriteUI();
            highlightPlaylist();
            
            // Reset Progress
            progressBar.value = 0;
            progressFill.style.width = '0%';
            currentTimeEl.innerText = '0:00';
            
            // The duration is set when metadata loads
        }

        // Play / Pause Logic
        function playSong() {
            isPlaying = true;
            playBtn.innerHTML = '<i class="fa-solid fa-pause text-xl"></i>';
            coverArt.classList.add('spin');
            audio.play();
        }

        function pauseSong() {
            isPlaying = false;
            playBtn.innerHTML = '<i class="fa-solid fa-play ml-1 text-xl"></i>';
            coverArt.classList.remove('spin');
            audio.pause();
        }

        playBtn.addEventListener('click', () => {
            if (isPlaying) pauseSong();
            else playSong();
        });

        // Next / Previous Logic
        function prevSong() {
            if (audio.currentTime > 3) {
                // Restart current song if played for a bit
                audio.currentTime = 0;
            } else {
                if (isShuffle && playedQueue.length > 0) {
                    songIndex = playedQueue.pop(); // Go back to previously played
                } else {
                    songIndex--;
                    if (songIndex < 0) songIndex = songs.length - 1;
                }
                loadSong(songs[songIndex]);
                if (isPlaying) playSong();
            }
        }

        function nextSong(autoPlay = false) {
            if (repeatMode === 2 && autoPlay) {
                // Repeat one (only matters if song ended naturally)
                audio.currentTime = 0;
                playSong();
                return;
            }

            playedQueue.push(songIndex);

            if (isShuffle) {
                let newIndex = songIndex;
                while (newIndex === songIndex) {
                    newIndex = Math.floor(Math.random() * songs.length);
                }
                songIndex = newIndex;
            } else {
                songIndex++;
                if (songIndex > songs.length - 1) {
                    songIndex = 0;
                    if (repeatMode === 0 && autoPlay) {
                        // Reached end, no repeat
                        loadSong(songs[songIndex]);
                        pauseSong();
                        return;
                    }
                }
            }
            loadSong(songs[songIndex]);
            if (isPlaying || autoPlay) playSong();
        }

        prevBtn.addEventListener('click', prevSong);
        nextBtn.addEventListener('click', () => nextSong(false));

        // Time formatting
        function formatTime(seconds) {
            if (isNaN(seconds)) return "0:00";
            const min = Math.floor(seconds / 60);
            const sec = Math.floor(seconds % 60);
            return `${min}:${sec < 10 ? '0' : ''}${sec}`;
        }

        // Update Progress
        audio.addEventListener('timeupdate', (e) => {
            const { duration, currentTime } = e.srcElement;
            const progressPercent = (currentTime / duration) * 100;
            
            if(!isNaN(progressPercent)) {
                progressBar.value = progressPercent;
                progressFill.style.width = `${progressPercent}%`;
            }
            currentTimeEl.innerText = formatTime(currentTime);
        });

        audio.addEventListener('loadedmetadata', () => {
            durationTimeEl.innerText = formatTime(audio.duration);
        });

        // Set Progress via Seek
        progressBar.addEventListener('input', (e) => {
            const width = e.target.value;
            const duration = audio.duration;
            audio.currentTime = (width / 100) * duration;
            progressFill.style.width = `${width}%`;
        });

        // Autoplay next song on end
        audio.addEventListener('ended', () => nextSong(true));

        // Volume Control
        function updateVolumeUI() {
            volumeFill.style.width = `${audio.volume * 100}%`;
            volumeBar.value = audio.volume;
            
            if (audio.muted || audio.volume === 0) {
                muteBtn.innerHTML = '<i class="fa-solid fa-volume-xmark"></i>';
                muteBtn.classList.add('text-red-400');
            } else if (audio.volume < 0.5) {
                muteBtn.innerHTML = '<i class="fa-solid fa-volume-low"></i>';
                muteBtn.classList.remove('text-red-400');
            } else {
                muteBtn.innerHTML = '<i class="fa-solid fa-volume-high"></i>';
                muteBtn.classList.remove('text-red-400');
            }
        }

        volumeBar.addEventListener('input', (e) => {
            audio.muted = false;
            audio.volume = e.target.value;
            updateVolumeUI();
        });

        muteBtn.addEventListener('click', () => {
            audio.muted = !audio.muted;
            updateVolumeUI();
        });

        // Shuffle Toggle
        shuffleBtn.addEventListener('click', () => {
            isShuffle = !isShuffle;
            shuffleBtn.classList.toggle('text-blue-400', isShuffle);
            shuffleBtn.classList.toggle('text-gray-400', !isShuffle);
            if(!isShuffle) playedQueue = []; // Clear history if shuffle turned off
        });

        // Repeat Toggle (0 -> 1 -> 2 -> 0)
        repeatBtn.addEventListener('click', () => {
            repeatMode = (repeatMode + 1) % 3;
            if (repeatMode === 0) {
                repeatBtn.innerHTML = '<i class="fa-solid fa-repeat"></i>';
                repeatBtn.classList.remove('text-blue-400');
                repeatBtn.classList.add('text-gray-400');
            } else if (repeatMode === 1) {
                repeatBtn.innerHTML = '<i class="fa-solid fa-repeat"></i>';
                repeatBtn.classList.add('text-blue-400');
                repeatBtn.classList.remove('text-gray-400');
            } else {
                repeatBtn.innerHTML = '<div class="relative"><i class="fa-solid fa-repeat"></i><span class="absolute -top-1 -right-2 text-[10px] font-bold bg-blue-600 rounded-full w-3 h-3 flex items-center justify-center text-white">1</span></div>';
                repeatBtn.classList.add('text-blue-400');
            }
        });

        // Favorite Logic
        favoriteBtn.addEventListener('click', () => {
            const currentSongId = songs[songIndex].id;
            if (favorites.has(currentSongId)) {
                favorites.delete(currentSongId);
            } else {
                favorites.add(currentSongId);
            }
            updateFavoriteUI();
        });

        function updateFavoriteUI() {
            const currentSongId = songs[songIndex].id;
            if (favorites.has(currentSongId)) {
                favoriteBtn.innerHTML = '<i class="fa-solid fa-heart text-red-500"></i>';
            } else {
                favoriteBtn.innerHTML = '<i class="fa-regular fa-heart"></i>';
            }
        }

        // Playlist Rendering
        function renderPlaylist() {
            playlistEl.innerHTML = '';
            songs.forEach((song, index) => {
                const li = document.createElement('li');
                li.className = `p-3 rounded-xl cursor-pointer transition-all flex items-center gap-4 hover:bg-gray-700/50 ${index === songIndex ? 'bg-gray-700/80 border border-gray-600' : 'border border-transparent'}`;
                li.onclick = () => {
                    songIndex = index;
                    loadSong(songs[songIndex]);
                    playSong();
                };
                
                li.innerHTML = `
                    <div class="w-12 h-12 rounded-lg overflow-hidden flex-shrink-0">
                        <img src="${song.cover}" alt="${song.title}" class="w-full h-full object-cover">
                    </div>
                    <div class="flex-1 overflow-hidden">
                        <h4 class="text-white text-sm font-semibold truncate ${index === songIndex ? 'text-blue-400' : ''}">${song.title}</h4>
                        <p class="text-gray-400 text-xs truncate">${song.artist}</p>
                    </div>
                    ${index === songIndex ? '<div class="w-4 flex justify-center"><i class="fa-solid fa-volume-high text-blue-400 text-xs"></i></div>' : ''}
                `;
                playlistEl.appendChild(li);
            });
        }

        function highlightPlaylist() {
            renderPlaylist(); // Re-render handles the highlighting and active icon
        }

        // Initialize on load
        window.addEventListener('DOMContentLoaded', initPlayer);

    </script>
</body>
</html>
